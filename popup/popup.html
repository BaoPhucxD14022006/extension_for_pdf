<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edge AI PDF Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div>
          <h1 class="title">Edge AI PDF</h1>
          <p class="subtitle">NVIDIA Nemotron 3.5</p>
        </div>
      </div>
      <span class="badge-nvidia" title="Sử dụng mô hình nvidia/nemotron-3.5-lightning-30b-a3b">
        <span class="dot"></span> NVIDIA
      </span>
    </header>

    <!-- Main Actions -->
    <div class="action-card">
      <button id="btnOpenViewer" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        Mở Trình đọc PDF
      </button>

      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="application/pdf" hidden>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <span>Chọn hoặc thả file PDF vào đây</span>
      </div>
    </div>

    <!-- Quick Settings Section -->
    <div class="settings-section">
      <div class="section-title">
        <span>Cấu hình NVIDIA API</span>
        <span id="apiStatus" class="status-pill status-unconfigured">Chưa nhập key</span>
      </div>

      <!-- Model Choice -->
      <div class="model-group">
        <label for="modelSelect" class="field-label">Mô hình AI</label>
        <select id="modelSelect" class="form-select">
          <option value="nvidia/nemotron-3.5-lightning-30b-a3b" selected>Nemotron 3.5 Lightning (30B) - Chuẩn NVIDIA</option>
          <option value="nvidia/llama-3.1-nemotron-70b-instruct">Nemotron (70B) - NVIDIA Flagship</option>
          <option value="nvidia/riva-translate-4b-instruct-v2">Riva Translate (4B) - Tốc độ cao</option>
        </select>
      </div>

      <div class="input-group">
        <label for="apiKeyInput" class="field-label">API Key</label>
        <div class="input-wrapper">
          <input type="password" id="apiKeyInput" placeholder="nvapi-..." autocomplete="off">
          <button type="button" id="btnToggleKey" class="btn-icon" title="Hiện/ẩn key">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <div class="button-row">
          <button id="btnSaveKey" class="btn btn-secondary btn-sm">Lưu cấu hình</button>
          <button id="btnTestKey" class="btn btn-outline btn-sm">Kiểm tra kết nối</button>
        </div>
      </div>
      <div id="testResult" class="test-result hidden"></div>
    </div>

    <!-- Features Overview -->
    <div class="features-list">
      <div class="feature-item">
        <span class="icon">✨</span>
        <span>Hỗ trợ Nemotron 3.5 & Mistral NeMo 12B</span>
      </div>
      <div class="feature-item">
        <span class="icon">🖍️</span>
        <span>Highlight nhiều màu & Chú thích</span>
      </div>
      <div class="feature-item">
        <span class="icon">💾</span>
        <span>Xuất PDF đã highlight & Sổ từ vựng</span>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>Manifest V3 • Edge AI PDF Reader</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
